[project]
name = "waermeregie"
version = "0.1.0"
description = "Heizungssteuerung für Pelletöfen in Home Assistant"
requires-python = ">=3.14"
license = "Apache-2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests warten mit echter Zeit auf Zustände des simulierten Ofens
"tests/*" = ["ASYNC109", "ASYNC110"]
"devtools/*" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true
