set_scene:
  fields:
    scene:
      required: true
      selector:
        text:
    minutes:
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
clear_scene:
pause_stove:
  fields:
    minutes:
      required: true
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
boost:
  fields:
    delta:
      required: true
      selector:
        number:
          min: -3
          max: 3
          step: 0.5
          unit_of_measurement: K
    minutes:
      required: true
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: min
pellets_refill:
  fields:
    kg:
      selector:
        number:
          min: 1
          max: 100
          step: 0.5
          unit_of_measurement: kg
pellets_set:
  fields:
    kg:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          unit_of_measurement: kg
    from_empty:
      selector:
        boolean:
pellets_empty:
warmup:
  fields:
    minutes:
      selector:
        number:
          min: 30
          max: 360
          unit_of_measurement: min
    arrive:
      selector:
        time:
cold:
  fields:
    minutes:
      selector:
        number:
          min: 30
          max: 360
          unit_of_measurement: min
feedback:
  fields:
    kind:
      required: true
      selector:
        select:
          options:
            - cold
            - ok
            - warm
    room:
      selector:
        text:
ai_suggest:
cancel_warmup:
